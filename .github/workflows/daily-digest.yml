name: Daily Commit Digest

on:
  schedule:
    # 08:08 IST = 02:38 UTC. Avoid peak times (00 and 30) for better reliability.
    - cron: "38 2 * * *"
  workflow_dispatch: {} # Trigger manually from Actions tab to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run digest
        run: npm start
        env:
          # ── Shared credentials ──────────────────────────────────────────────
          GITHUB_TOKEN: ${{ secrets.DIGEST_GH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}

          # ── All users' Jira tokens in one JSON map ─────────────────────────
          # Format: {"pradeep": "ATATT3x...", "kharthik": "ATATT3x...", "ravi": "..."}
          # To add a new person: update this ONE secret. No YAML changes needed.
          JIRA_TOKENS_JSON: ${{ secrets.JIRA_TOKENS_JSON }}
